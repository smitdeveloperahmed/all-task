<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Combinators</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="descendant">
        <p>Descendant 1</p>
        <p>Descendant 2</p>
    </div>

    <div class="child">
        <p>Child 1</p>
        <p>Child 2</p>
    </div>

    <div class="adjacent-sec">
        <h2>Heading</h2>
        <p>Adjacent 1</p>
        <p>Adjacent 2</p>
    </div>

    <div class="general-sec">
        <h2>Heading</h2>
        <p>General 1</p>
        <span>Span</span>
        <p>General 2</p>
    </div>

</body>
</html>
