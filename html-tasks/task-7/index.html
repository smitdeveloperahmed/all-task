<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, green, #0070c0, red, orange, gold);
      }

      table {
        border-collapse: collapse;
      }

      td {
        width: 40px;
        height: 40px;
        border: 1px solid black;
        background-color: white;
      }

      /* big colored squares */
      .home {
        border: none;
        text-align: center;
      }

      .green {
        background-color: green;
      }
      .yellow {
        background-color: gold;
      }
      .red {
        background-color: red;
      }
      .blue {
        background-color: #0070c0;
      }

      /* dark box inside home with 4 circles */
      .box {
        width: 120px;
        height: 120px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        justify-items: center;
      }

      .green .box {
        background-color: #006b1b;
      }
      .yellow .box {
        background-color: #ffd000;
      }
      .red .box {
        background-color: #b81d1d;
      }
      .blue .box {
        background-color: #004a8c;
      }

      .dot {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background-color: white;
      }

      /* center part */
      .center {
        border: none;
        background: conic-gradient(yellow, blue, red, green, yellow);
      }
    </style>
  </head>
  <body>
    <table>
      <!-- row 1 -->
      <tr>
        <td class="home green" rowspan="6" colspan="6">
          <div class="box">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </td>
        <td></td>
        <td></td>
        <td></td>
        <td class="home yellow" rowspan="6" colspan="6">
          <div class="box">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </td>
      </tr>

      <!-- row 2 to 6 -->
      <tr>
        <td></td>
        <td class="yellow"></td>
        <td class="yellow"></td>
      </tr>
      <tr>
        <td class="green"></td>
        <td class="yellow"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="yellow"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="yellow"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="yellow"></td>
        <td></td>
      </tr>

      <!-- row 7 -->
      <tr>
        <td></td>
        <td class="green"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="center" rowspan="3" colspan="3"></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="yellow"></td>
        <td></td>
        <td></td>
      </tr>

      <!-- row 8 -->
      <tr>
        <td></td>
        <td class="green"></td>
        <td class="green"></td>
        <td class="green"></td>
        <td class="green"></td>
        <td class="green"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td></td>
      </tr>

      <!-- row 9 -->
      <tr>
        <td></td>
        <td></td>
        <td class="red"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="blue"></td>
        <td></td>
      </tr>

      <!-- row 10 -->
      <tr>
        <td class="home red" rowspan="6" colspan="6">
          <div class="box">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </td>
        <td></td>
        <td class="red"></td>
        <td></td>
        <td class="home blue" rowspan="6" colspan="6">
          <div class="box">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </td>
      </tr>

      <!-- row 11 to 15 -->
      <tr>
        <td></td>
        <td class="red"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="red"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="red"></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="red"></td>
        <td class="blue"></td>
      </tr>
      <tr>
        <td></td>
        <td class="red"></td>
        <td></td>
      </tr>
    </table>
  </body>
</html>
